<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="30" />
    <title>Kijo is being upgraded</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(47, 128, 237, 0.14), transparent 42%),
          #f4f7fb;
      }

      main {
        width: min(100%, 540px);
        padding: 48px 40px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(23, 32, 51, 0.1);
      }

      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        color: #ffffff;
        background: #2f80ed;
        border-radius: 16px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.4rem);
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      p {
        margin: 18px auto 0;
        max-width: 420px;
        color: #5f6b7a;
        font-size: 1rem;
        line-height: 1.65;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 28px;
        color: #1f5fae;
        font-size: 0.875rem;
        font-weight: 700;
      }

      .status::before {
        width: 9px;
        height: 9px;
        content: "";
        background: #2f80ed;
        border-radius: 50%;
        box-shadow: 0 0 0 5px rgba(47, 128, 237, 0.14);
      }

      @media (max-width: 480px) {
        main {
          padding: 38px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">K</div>
      <h1>Kijo is being upgraded</h1>
      <p>
        We are applying an update and will be back shortly. This page will refresh automatically.
      </p>
      <div class="status" role="status">Maintenance in progress</div>
    </main>
    <script>
      (() => {
        let redirecting = false

        const checkMaintenanceStatus = async () => {
          if (redirecting) return

          try {
            const response = await fetch('/maintenance-status.json', { cache: 'no-store' })
            if (!response.ok) return

            const status = await response.json()
            if (status?.maintenance !== false) return

            redirecting = true
            const target = new URL('/', window.location.origin)
            target.searchParams.set('v', String(Date.now()))
            window.location.replace(target.toString())
          } catch {
            // Keep showing maintenance until a valid inactive status is available.
          }
        }

        checkMaintenanceStatus()
        window.setInterval(checkMaintenanceStatus, 10000)
        window.addEventListener('focus', checkMaintenanceStatus)
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') checkMaintenanceStatus()
        })
      })()
    </script>
  </body>
</html>
